<!doctype html>
<html>
  <head>
    <title> login page</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        color: white;
        background-color: white;
      }
      .box {
        background-color: black;
        border: 1px solid #ddd;
        padding: 25px;
        width: 400px;
        border-radius: 8px;
        margin: 20px auto;
        padding-left: 150px;
        margin-top: 80px;
      }
      .img {
        height: 40px;
        padding-left: 150px;
        padding-bottom: 20px;
      }
      button {
        width: 250px;
        height: 30px;
        gap: 20px;
        margin-top: 20px;
        border-radius: 15px;
        border: none;
      }

      .search {
        height: 50px;
        width: 250px;
        border-radius: 5px;
        color: black;
        background-color: black;
        border-color: gray;
      }
      .p {
        padding-left: 120px;
      }
      .color {
        color: gray;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img
        class="img"
        src="https://upload.wikimedia.org/wikipedia/commons/b/b7/X_logo.jpg"
      />
      <p>Sign in to X</p>
      <button>Sign in with Google</button>
      <br />
      <button>Sign in with Apple</button>
      <p class="p">or</p>
      <input
        class="search"
        type="email"
        placeholder="Phone, email address, or username"
      />
      <br />
      <button>Next</button>
      <br />
      <button>Forget password?</button>
      <p class="color">Don't have an account? Sign up</p>
    </div>
  </body>
</html>
